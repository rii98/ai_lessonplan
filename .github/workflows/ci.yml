name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      # Unit tests only — no Qdrant/Ollama. Live contract tests stay gated behind
      # RUN_INTEGRATION and are not run in CI.
      - name: Unit tests
        run: pytest -q

      # Acceptance gate: score the golden exemplar LDDs against the rubric. Fails
      # the build on silent quality drift from a prompt/model/scorer change.
      - name: Eval gate
        run: python -m lessonforge.eval
