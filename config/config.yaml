# ─────────────────────────────────────────────────────────────────────────────
#  LessonForge — single source of truth for swappable components.
#
#  To swap ANY component, change its `provider:` key here (and, if needed, the
#  provider-specific fields below it). No code changes. The registry resolves
#  `provider` -> adapter class at startup; every consumer depends only on the
#  abstract interface, never the concrete class.
#
#  Env vars override any value: LF__LLM__MODEL=... , LF__VECTOR_STORE__URL=...
#  (double-underscore = nesting). ${VAR:-default} interpolation also works below.
# ─────────────────────────────────────────────────────────────────────────────

app:
  name: LessonForge
  env: ${LF_ENV:-local}

llm:
  provider: ollama                      # ← swap: ollama | openai | ...
  model: gemma4:31b-cloud               # ← swap the model in one line
  base_url: ${OLLAMA_BASE_URL:-http://localhost:11434}
  temperature: 0.7
  timeout_s: 180
  max_retries: 2

# Optional per-stage model (SRD §07): a cheap fast model for intake/extraction,
# while `llm` above is the strong reasoning model for enrichment + critique.
# Omit this block to reuse `llm` everywhere. Same fields as `llm`.
# llm_fast:
#   provider: ollama
#   model: gemma4:4b-cloud
#   base_url: ${OLLAMA_BASE_URL:-http://localhost:11434}

embedding:
  provider: fastembed                   # ← swap: fastembed | ...
  model: BAAI/bge-small-en-v1.5
  # dim is auto-detected from the model; override only if using a custom impl.

sparse_embedding:
  provider: fastembed                   # ← the lexical (BM25) half of hybrid search
  model: Qdrant/bm25                    # lightweight, offline; no neural model
  # Only built/used when retrieval.hybrid is true (below).

reranker:
  provider: fastembed                   # ← swap: fastembed | http | noop
  model: Xenova/ms-marco-MiniLM-L-6-v2
  # For provider: http (a standalone FastAPI reranker service), set:
  # endpoint: http://reranker:8100/rerank

vector_store:
  provider: qdrant                      # ← swap: qdrant | ...
  url: ${QDRANT_URL:-http://localhost:6333}
  api_key: ${QDRANT_API_KEY:-}
  collection_prefix: lf                 # collections become lf_<name>

retrieval:
  top_k: 20                             # candidates pulled from vector search
  rerank_top_n: 5                       # kept after reranking
  hybrid: true                          # dense ⊕ BM25 sparse, RRF-fused, then reranked
  # Degrades to dense-only for stores/collections without a sparse index, so it's
  # safe before existing corpora are re-ingested. Re-run ingest to light up sparse.

chunking:
  # How documents are split before embedding. `default` applies to any source;
  # `by_format` overrides per loader format so a Markdown book gets the
  # structure-aware chunker (preserves chapter/section hierarchy → heading_path
  # metadata) while JSONL keeps simple paragraph packing. `params` tune whichever
  # chunker is built (e.g. max_chars, min_chars). Swap a strategy in one line.
  default: paragraph                    # ← swap: paragraph | markdown
  by_format:
    markdown: markdown
  params:
    max_chars: 1200                     # markdown sections longer than this are paragraph-packed
    # min_chars: 400                    # merge consecutive tiny sections under one parent (off by default)

grounding:
  # Which corpora enrichment retrieves from, how much each contributes, and which
  # brief fields become metadata filters. Ingest with: python -m lessonforge.rag.ingest --seed
  collections: [reference, curriculum, pedagogical, exemplar, local_context]
  per_collection_top_n: 5
  filter_fields: [grade, subject]       # grade/subject filter on search (lenient fallback if empty)
  # How much of a book each authoritative hit returns: narrow (the reranked chunk),
  # section (expanded to its whole section), or broad (expanded to its whole chapter).
  # Only authoritative collections are expanded — flat seed corpora stay narrow.
  # A unit planner asks for broad; a single quiz question asks for narrow.
  default_granularity: narrow           # ← narrow | section | broad
  broad_max_chars: 8000                 # budget cap when a section/chapter is reassembled
  # Quality gate (recall-biased; off by default). `min_score` is a top-anchored
  # garbage floor: if even the best reranked hit is below it, the collection's
  # hits are dropped as "no usable context" (never prunes marginal individual
  # hits). Calibrate from the shadow-logged reranker scores. `verify` adds an LLM
  # yes/no relevance check on the top authoritative hit (the real judge; fast model).
  # min_score: 0.10                      # ← uncomment + tune once you've seen your reranker's scale
  verify: false                          # ← LLM relevance check on the top book hit

planner:
  # Decides how much context a need requires (narrow/section/broad) before
  # retrieving — a unit plan pulls a chapter, a quiz question pulls one chunk.
  provider: heuristic                    # ← swap: heuristic | llm | hybrid
  default_granularity: narrow            # when no kind/stem gives a signal
  cache: true                            # memoize plans by (kind, need)
  # When `reference` (real course material) has hits, the prompt is told to prefer
  # it over the model's general knowledge and cite it; when empty, generation just
  # falls back to the model. Add other authoritative corpora here if you curate them.
  authoritative_collections: [reference]

intake:
  # Turns a raw request (or a pasted existing plan, US-3) into a NormalizedBrief.
  provider: llm                         # ← swap: llm | heuristic (deterministic, no model)

critique:
  # The critique→revise loop. The critic scores the draft LDD on the anti-generic
  # rubric; the reviser rewrites weak sections until the weighted overall clears
  # `threshold` or `max_iterations` is hit. `structural` is deterministic + free.
  provider: structural                  # ← swap: structural | llm | composite | noop
  threshold: 0.7
  max_iterations: 1
  # weights: { engagement: 1.0, alignment: 1.0, misconception_coverage: 1.0,
  #            specificity: 1.0, local_relevance: 1.0 }   # empty = equal weighting

profile:
  # Where a teacher's stored preferences (defaults + voice + local anchors) live.
  # They fill unset request fields and flavour every generated lesson (US-1/US-5).
  provider: memory                      # ← swap: memory (non-persistent) | file
  # path: .lessonforge/profiles         # directory for provider: file

export:
  # Which output format each teaching artifact defaults to. The registry maps
  # (artifact, format) -> renderer, so swapping a format is a one-line change.
  lesson_plan: docx                     # ← swap: docx | md
  slides: pptx                          # ← swap: pptx
  worksheet: docx                       # ← swap: docx | md
  quiz: docx                            # ← swap: docx | md
  bundle: [lesson_plan, slides, worksheet, quiz]   # one-click zip contents
  # Devanagari-capable font embedded as the complex-script hint so Nepali text
  # renders in Word/PowerPoint (not tofu boxes).
  body_font: Calibri
  devanagari_font: Noto Sans Devanagari

# Multi-day units (plan-and-expand) have no config knobs yet: the planner grounds
# BROADLY (whole chapter) to lay out the arc, each day is expanded by the same
# generator + revise loop, and a deterministic coherence pass reports cross-day
# issues. Endpoints: /units/plan, /units/generate, /units/{id}/days/{n}/regenerate.

documents:
  # The document/version memory layer: persists generated lessons/units and their
  # edit history so a teacher can revisit, edit, and undo. Same pluggable store as
  # chat. memory = non-persistent (dev/tests); sqlite = one file; postgres = DSN.
  provider: sqlite                      # ← swap: memory | sqlite | postgres
  path: .lessonforge/documents.db       # for provider: sqlite
  url: ${DOCS_DB_URL:-}                 # for provider: postgres (DSN via env)

chat:
  # The QA chatbot — a streaming, persistent, advanced-RAG assistant over the
  # collections. Every stage below is tuneable; flip a flag to disable a technique.
  store:
    provider: sqlite                    # ← swap: memory | sqlite | postgres
    path: .lessonforge/chat.db          # for provider: sqlite
    url: ${CHAT_DB_URL:-}               # for provider: postgres (DSN via env; docker sets it)
  retrieval:
    collections: [reference, curriculum, pedagogical, exemplar, local_context]
    per_collection_top_n: 4             # candidates pulled from each collection, per query
    top_k: 20                           # dense/hybrid candidate pool (from retrieval.top_k)
    rerank_top_n: 8                     # kept after fusing + reranking across queries
    filter_fields: [grade, subject, class]   # which default tags become scoped-mode filters
    default_mode: scoped                # scoped (apply tag filters) | broad (search everything)
    # Coverage + priority over the reranked union (all soft, applied after rerank).
    # Pure reranking is collection-blind — one strong collection can take every slot.
    min_per_collection: 1               # floor: each retrieved collection gets ≥ this many
    min_per_collection_overrides:       # raise the floor for specific collections
      reference: 2                      # the authoritative course material earns more
    collection_weights:                 # ranking bias (final = score × weight); keep small
      reference: 1.2                    # surface authoritative sources first in the citations
    # min_score: 0.0                    # floor to skip filling a reserved slot with a weak hit
    #                                   # (leave unset unless you've tuned it to your reranker)
  query_transform:
    provider: llm                       # ← swap: llm | passthrough (no LLM)
    condense_history: true              # rewrite follow-ups into standalone queries
    expansions: 3                       # multi-query paraphrases; 0 disables
    hyde: false                         # retrieve with a hypothetical answer passage
  context:
    max_chars: 6000                     # grounding budget fed to the answer model
    compression: false                  # LLM sentence-level relevance filtering (extra cost)
  memory:
    window_turns: 8                     # recent turns kept verbatim (1 turn = user+assistant)
    summarize: true                     # roll older turns into a running summary
    summary_trigger_turns: 12           # start summarizing once the thread exceeds this
  synthesis:
    temperature: 0.3
    require_citations: true             # instruct the model to cite [n] from the sources
