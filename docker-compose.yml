# LessonForge local stack.
#
#   docker compose up --build     # first time, or after a dependency change
#   docker compose up             # thereafter — source is bind-mounted + --reload,
#                                 # so code edits are live with NO rebuild
#
# The reranker + embedder run in-process (FastEmbed), so the only external
# service is Qdrant. The LLM (Ollama) runs on the HOST — set it up with:
#   ollama serve            # or the desktop app
#   ollama signin           # for :cloud models
# The api container reaches it via host.docker.internal.

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST/gRPC
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Persistent store for the chatbot's conversations + messages. The lesson
  # pipeline needs only Qdrant; the chat subsystem adds this. Swap the chat store
  # back to sqlite/memory in config and this service is simply unused.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lessonforge
      POSTGRES_PASSWORD: lessonforge
      POSTGRES_DB: lessonforge
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lessonforge -d lessonforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # These env vars override config/config.yaml (LF__SECTION__KEY).
      LF_CONFIG: /app/config/config.yaml
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LF_ENV: docker
      # Use the Docker-backed Postgres for chat persistence.
      LF__CHAT__STORE__PROVIDER: postgres
      CHAT_DB_URL: postgresql://lessonforge:lessonforge@postgres:5432/lessonforge
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach host Ollama on Linux
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - fastembed_cache:/app/.cache/fastembed
      # Bind-mount source + config so host edits are live in the container.
      # Combined with the editable install and --reload below, a code change
      # never needs `docker compose up --build` — just save the file.
      - ./src:/app/src
      - ./config:/app/config
      - ./corpus:/app/corpus
    # --reload restarts the server on any change under the mounted src (watchfiles
    # ships with uvicorn[standard]).
    command:
      - uvicorn
      - lessonforge.api.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src

volumes:
  qdrant_data:
  fastembed_cache:
  pg_data:
