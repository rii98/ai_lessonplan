[project]
name = "lessonforge"
version = "0.1.0"
description = "AI Lesson Plan Creator — pluggable RAG + LLM pipeline that thinks like an experienced teacher."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "qdrant-client>=1.10",
    "fastembed>=0.3",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "PyJWT[crypto]>=2.9",
]

[project.scripts]
lessonforge-ingest = "lessonforge.rag.ingest:main"
lessonforge-eval = "lessonforge.eval.__main__:main"
lessonforge-db = "lessonforge.db.migrate:main"
lessonforge-admin = "lessonforge.admin.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lessonforge = ["api/static/*.html", "api/static/*.js", "api/static/*.css",
               "api/static/vendor/*", "db/migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires live services (qdrant/ollama). Run with RUN_INTEGRATION=1.",
]
# Postgres contract tests run when TEST_DATABASE_URL is set (CI sets it); they
# create and drop their own throwaway database.
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# BLE001: we intentionally catch broad exceptions in health/graceful-degradation
# paths so a flaky backend degrades instead of crashing the request.
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
# B008: `Depends(...)` in argument defaults is the idiomatic FastAPI pattern.
"src/lessonforge/api/*.py" = ["B008"]
