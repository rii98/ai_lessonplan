<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LessonForge — Owner console</title>
<link rel="stylesheet" href="/static/app.css" />
<style>
  .console { display: grid; grid-template-columns: 200px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 760px) { .console { grid-template-columns: 1fr; } }
  .side a { display: block; padding: 8px 12px; border-radius: 8px; color: var(--ink);
            text-decoration: none; margin-bottom: 2px; }
  .side a.active { background: var(--brand); color: var(--brand-ink); }
  .side a:hover:not(.active) { background: var(--chip); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
         padding: 12px 14px; }
  .kpi .v { font-size: 22px; font-weight: 700; }
  .kpi .l { color: var(--muted); font-size: 12px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--warn); }
  table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.t th { text-align: left; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line);
               padding: 6px 8px; }
  table.t td { border-bottom: 1px solid var(--line); padding: 7px 8px; vertical-align: top; }
  table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: var(--chip); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .filters input, .filters select { max-width: 200px; }
  pre.json { background: var(--chip); padding: 10px; border-radius: 8px; overflow: auto;
             max-height: 320px; font-size: 12px; }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--chip); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  code.cmd { background: var(--chip); padding: 2px 6px; border-radius: 6px; }
  .section-h { display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>
<header class="top"></header>
<div class="wrap">
  <div class="console">
    <nav class="side card" id="side" aria-label="Console sections"></nav>
    <main id="view" class="card" style="padding:18px"><p class="sub">Loading…</p></main>
  </div>
</div>
<script src="/static/lf.js"></script>
<script src="/static/app.js"></script>
<script src="/static/admin.js"></script>
</body>
</html>
